# Calls /api/send-reminders every hour so each person's daily reminder goes out at the
# hour they picked. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://behave-oxeon.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# Until both are set, the job does nothing.
name: Daily reminders

on:
  schedule:
    - cron: '7 * * * *' # minute 7: GitHub delays jobs queued exactly on the hour
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set — skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/send-reminders"
